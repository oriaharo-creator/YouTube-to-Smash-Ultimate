name: Build Windows installer

# Builds the one-folder app and the Inno Setup installer on Windows.
# - Runs on every push to a v* tag (e.g. v1.0.0) and attaches the installer to
#   a GitHub Release.
# - Can also be run manually (workflow_dispatch) to produce a build artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # needed to create/attach the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.11 or 3.12 (NOT 3.13: pydub needs audioop)

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      # --- Fetch the bundled command-line tools into bin/ -------------------
      # These are third-party binaries (not committed). The asset PATTERNS below
      # may need adjusting if upstream renames their release files.
      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName -Destination bin -Force }

      - name: Fetch VGAudio (VGAudioCli.exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Thealexbarney/VGAudio --pattern "*.zip" --dir vg_tmp
          Expand-Archive (Get-ChildItem vg_tmp\*.zip | Select-Object -First 1).FullName -DestinationPath vg_extract -Force
          # Copy the CLI and any companion DLLs next to it.
          Get-ChildItem vg_extract -Recurse -Include VGAudioCli.exe,VGAudio*.dll |
            ForEach-Object { Copy-Item $_.FullName -Destination bin -Force }

      - name: Fetch nus3audio-rs (nus3audio.exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo jam1garner/nus3audio-rs --pattern "*.exe" --dir n3_tmp
          $exe = Get-ChildItem n3_tmp\*.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin\nus3audio.exe -Force

      - name: Preflight (tools resolve?)
        shell: pwsh
        run: python cli.py --check
        continue-on-error: true   # informational; don't fail the build here

      - name: Freeze with PyInstaller
        run: python -m PyInstaller --noconfirm --clean yt2smash.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\yt2smash.iss

      - name: Package portable zip (exe at root)
        shell: pwsh
        run: |
          # Zip the *contents* of the onedir folder so YouTubeToSmash.exe is at
          # the archive root - the clean, no-build download for GameBanana / the
          # GitHub release. Tag builds get the version in the name.
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path dist\YouTubeToSmash\* -DestinationPath "YouTubeToSmash-$ver-windows-x64.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeToSmash-windows
          path: |
            installer/Output/*.exe
            YouTubeToSmash-*-windows-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            YouTubeToSmash-*-windows-x64.zip
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.11 or 3.12 (NOT 3.13: pydub needs audioop)

      - name: Install system runtime + build libs
        run: |
          sudo apt-get update
          # ffmpeg/ffprobe (native), mono (to run VGAudioCli.exe), and the Qt
          # platform libs PySide6 needs at runtime.
          sudo apt-get install -y --no-install-recommends \
            ffmpeg mono-runtime libmono-system-numerics4.0-cil \
            libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      # --- Assemble bin/ with the Linux tool set ----------------------------
      - name: Stage ffmpeg / ffprobe
        run: |
          mkdir -p bin
          cp "$(command -v ffmpeg)"  bin/ffmpeg
          cp "$(command -v ffprobe)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Fetch VGAudio (VGAudioCli.exe, run via mono)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Thealexbarney/VGAudio --pattern "*.zip" --dir vg_tmp
          unzip -o vg_tmp/*.zip -d vg_extract
          # Copy the CLI and any companion DLLs next to it.
          find vg_extract \( -name 'VGAudioCli.exe' -o -name 'VGAudio*.dll' \) \
            -exec cp {} bin/ \;

      - name: Build nus3audio (native, via cargo)
        run: |
          cargo install --git https://github.com/jam1garner/nus3audio-rs --root nus3_build
          cp nus3_build/bin/nus3audio bin/nus3audio
          chmod +x bin/nus3audio

      - name: Preflight (tools resolve?)
        run: python cli.py --check
        continue-on-error: true   # informational; don't fail the build here

      - name: Freeze with PyInstaller
        run: python -m PyInstaller --noconfirm --clean yt2smash.spec

      - name: Bundle launcher + package tarball
        run: |
          cp linux/install.sh linux/yt2smash.desktop dist/YouTubeToSmash/ || true
          VERSION="${GITHUB_REF_NAME:-dev}"
          tar -C dist -czf "YouTubeToSmash-${VERSION}-linux-x86_64.tar.gz" YouTubeToSmash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeToSmash-linux
          path: YouTubeToSmash-*-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Attach tarball to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: YouTubeToSmash-*-linux-x86_64.tar.gz
          generate_release_notes: true
